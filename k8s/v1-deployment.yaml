
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketplace-v1
  template:
    metadata:
      labels:
        app: marketplace-v1
    spec:
      containers:
        - name: marketplace-v1
          image: aakash05012007/marketplace:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
